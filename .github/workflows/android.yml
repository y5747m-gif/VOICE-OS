name: VOICE OS Android

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      emulator:
        description: Also run Android instrumented smoke checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the runner's preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 scripts/check-resources.py
      - name: Build and lint Android
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/voice-os-gradle.log"
          if ./gradlew --no-daemon --console=plain :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$log"; then
            exit 0
          fi
          failure="$(tail -c 7500 "$log")"
          failure="${failure//'%'/'%25'}"
          failure="${failure//$'\r'/'%0D'}"
          failure="${failure//$'\n'/'%0A'}"
          printf '::error title=Android build or lint failed::%s\n' "$failure"
          exit 1
      - name: Check merged debug APK permission surface
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -E "android\.permission\.(REQUEST_INSTALL_PACKAGES|READ_CONTACTS|CALL_PHONE|SEND_SMS|CAMERA|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES)"; then
            echo 'Unexpected permission in the merged APK' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: voice-os-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the runner's preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - uses: gradle/actions/setup-gradle@v5
      - name: Grant runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
